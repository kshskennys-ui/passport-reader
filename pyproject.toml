[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "identity-document-data-page-extractor"
version = "0.1.0"
description = "Local OpenCV tool for extracting identity document data pages"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.10",
    "PyMuPDF>=1.25",
    "Pillow>=10.0",
    "PySide6>=6.7",
    "PyYAML>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
ocr = ["paddleocr>=3.7,<4", "paddlepaddle>=3.3,<4"]

[project.scripts]
identity-data-page = "main:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main", "config", "models", "image_utils"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
